<nav class="sidebar" aria-label="Guide contents">
  <p class="sidebar-title">Contents</p>
  <ol>
    {% for item in site.data.navigation %}
    <li>
      <a href="{{ item.url | relative_url }}"
         {% if page.url == item.url %}class="active" aria-current="page"{% endif %}>
        {{ item.title }}
      </a>
    </li>
    {% endfor %}
  </ol>
</nav>
